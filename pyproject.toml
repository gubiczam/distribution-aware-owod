[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "distribution-aware-owod"
version = "0.4.0"
description = "Distribution-aware active learning for Open-World Object Detection."
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "PyYAML>=6,<7",
    "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7,<8",
    "matplotlib>=3.8,<4",
    "nbconvert>=7,<8",
    "nbformat>=5,<6",
    "pandas>=2.2,<3",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["daowod*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
