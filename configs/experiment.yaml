# Contribution A experiment configuration.
#
# This file is authoritative: `daowod-run campaign --config configs/experiment.yaml`
# reads it and nothing else. Strategy names MUST carry an explicit semantics
# version. `full` alone is rejected because it means two different things:
#   v1:full  the pre-audit formula (legacy_prob_score uncertainty, min-max
#            normalisation, absolute-density coherence) - use to reproduce
#            published pilot numbers
#   v2:full  the current definition (posterior entropy, rank normalisation,
#            scale-free within-cluster coherence)
# See docs/migration_strategies.md.

name: contribution-a

active_learning:
  rounds: 1
  # Single-strategy entry point; the campaign uses acquisition.strategies.
  strategy: v2:full
  budget: 10
  initial_images: 20
  budget_per_round: 10
  seeds:
    - 0

acquisition:
  strategies:
    - v2:random
    - v2:uncertainty
    - v2:full
    - v2:full_no_coherence
  # Shared parameter overrides applied on top of each resolved v2 spec. They are
  # deliberately NOT applied to v1 specs, whose whole purpose is to stay fixed.
  uncertainty_method: entropy       # entropy | margin | one_minus_max | legacy_prob_score
  rarity_method: log_inverse_frequency
  coherence_method: relative_within_cluster  # | neighbour_consistency | density
  normalisation: rank               # rank | ecdf | minmax | zscore_sigmoid | none
  pseudo_label_source: cluster      # cluster | predicted
  cluster_count: 20
  neighbour_count: 5
  image_aggregation: top_k_mean     # top_k_mean | max | mean | noisy_or
  top_k: 3
  coherence_exponent: 1.0
  singleton_coherence: 0.0
  minimum_cluster_size: 3
  # Only version-1 strategies read these; kept so legacy configs still load.
  weights:
    uncertainty: 0.3
    novelty: 0.2
    rarity: 0.5
    coherence_power: 1.0
    rarity_power: 1.0

dataset:
  image_set_path: /path/to/PROB/data/OWOD/ImageSets/TOWOD/owod_t2_train.txt
  annotations_dir: /path/to/PROB/data/OWOD/Annotations
  # Replace with the exact unknown classes for the OWOD task/protocol you run.
  # For M-OWODB Task-1 -> Task-2 these are the 20 Task-2 classes.
  unknown_classes:
    - REPLACE_WITH_UNKNOWN_CLASS
  # Optional: enables the class-aware known-side grouped metrics.
  known_classes: []
  # Leave unset to use the class_stats.csv written by the long-tail protocol.
  class_groups_path: null
  known_class_groups_path: null
  long_tail:
    enabled: true
    imbalance_ratio: 50.0

evaluation:
  # Head/medium/tail recall and AP, computed from the bridge's detections JSON.
  grouped_metrics: true
  iou_threshold: 0.5
  unknown_prediction_name: unknown
  # Fail loudly rather than silently reporting a campaign with no long-tail
  # measurement, which is the failure the audit found (S3).
  require_detections: true

prob:
  repository_path: /path/to/PROB
  initial_checkpoint: /path/to/PROB/exps/MOWODB/PROB/t1.pth
  train_command: >-
    python daowod_prob_bridge.py train
    --labelled-ids {labelled_ids}
    --previous-checkpoint {previous_checkpoint}
    --output-checkpoint {checkpoint}
    --output-dir {output_dir}
    --seed {seed}
  predict_command: >-
    python daowod_prob_bridge.py predict
    --image-ids {image_ids}
    --checkpoint {checkpoint}
    --output {proposals}
  # --detections-output is what makes grouped long-tail metrics possible.
  evaluate_command: >-
    python daowod_prob_bridge.py evaluate
    --checkpoint {checkpoint}
    --output {metrics}
    --output-dir {output_dir}
  timeout_seconds: 86400

output_dir: outputs/contribution-a
